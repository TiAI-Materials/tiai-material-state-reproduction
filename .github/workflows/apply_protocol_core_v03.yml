name: Apply ProtocolCore v0.3 branch payload

on:
  push:
    branches:
      - feat/tiai-agentbench-protocol-core-v0.3
    paths:
      - matbench/tools/apply_protocol_core_v03.py
      - matbench/tools/protocol_core_v03_payload/**
      - .github/workflows/apply_protocol_core_v03.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply verified payload
        run: python matbench/tools/apply_protocol_core_v03.py
      - name: Validate before commit
        env:
          PYTHONPATH: matbench/src
        run: |
          python -m compileall -q matbench/src matbench/tests
          python -m unittest discover -s matbench/tests -v
          python -m tiai_matbench validate-adapters --adapters matbench/DOMAIN_ADAPTER_REGISTRY.json
          python -m tiai_matbench validate-protocols --protocols matbench/protocols/protocols_v0.3.jsonl --adapters matbench/DOMAIN_ADAPTER_REGISTRY.json --suites matbench/SUITE_REGISTRY.json
          python -m tiai_matbench score-work-runs --protocols matbench/protocols/protocols_v0.3.jsonl --runs matbench/examples/protocol_oracle_runs.jsonl --require-vss 1.0 --require-wrc 1.0
          python -m tiai_matbench score-work-runs --protocols matbench/protocols/protocols_v0.3.jsonl --runs matbench/examples/protocol_negative_runs.jsonl --output protocol_negative_report.json
      - name: Commit ProtocolCore v0.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add cross-industry work-replacement protocol core"
          git push origin HEAD:${GITHUB_REF_NAME}
