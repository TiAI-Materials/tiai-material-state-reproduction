name: TiAI-AgentBench

on:
  pull_request:
    paths:
      - "matbench/**"
      - ".github/workflows/matbench.yml"
  push:
    paths:
      - "matbench/**"
      - ".github/workflows/matbench.yml"

permissions:
  contents: read

jobs:
  deterministic-benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: matbench/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile benchmark package
        run: python -m compileall -q matbench/src matbench/tests
      - name: Unit tests
        run: python -m unittest discover -s matbench/tests -v
      - name: Validate full-stack suite registry
        run: |
          python -m tiai_matbench validate-registry \
            --registry matbench/SUITE_REGISTRY.json \
            --roadmap matbench/suites/roadmap_v0.2.jsonl \
            --output suite_registry_report.json
      - name: Validate cross-industry domain adapters
        run: |
          python -m tiai_matbench validate-adapters \
            --adapters matbench/DOMAIN_ADAPTER_REGISTRY.json \
            --output domain_adapter_report.json
      - name: Validate work-replacement protocols
        run: |
          python -m tiai_matbench validate-protocols \
            --protocols matbench/protocols/protocols_v0.3.jsonl \
            --adapters matbench/DOMAIN_ADAPTER_REGISTRY.json \
            --suites matbench/SUITE_REGISTRY.json \
            --output work_protocol_validation.json
      - name: Work-replacement oracle regression
        run: |
          python -m tiai_matbench score-work-runs \
            --protocols matbench/protocols/protocols_v0.3.jsonl \
            --runs matbench/examples/protocol_oracle_runs.jsonl \
            --output protocol_oracle_report.json \
            --require-vss 1.0 \
            --require-wrc 1.0
      - name: Work-replacement adversarial regression
        run: |
          python -m tiai_matbench score-work-runs \
            --protocols matbench/protocols/protocols_v0.3.jsonl \
            --runs matbench/examples/protocol_negative_runs.jsonl \
            --output protocol_negative_report.json
          python - <<'PYCODE'
          import json
          report = json.load(open("protocol_negative_report.json", encoding="utf-8"))
          assert report["metrics"]["VSS"] == 0.0
          assert "FALSE_SUCCESS_CLAIM" in report["violation_counts"]
          assert "UNSAFE_TRAJECTORY" in report["violation_counts"]
          PYCODE
      - name: Validate task and reference bundle
        run: |
          python -m tiai_matbench validate \
            --tasks matbench/tasks/dev.jsonl \
            --references matbench/references/dev.jsonl \
            --manifest matbench/MANIFEST.json
      - name: Verify frozen source assets
        run: |
          python -m tiai_matbench verify-assets \
            --tasks matbench/tasks/dev.jsonl \
            --references matbench/references/dev.jsonl \
            --manifest matbench/MANIFEST.json \
            --repository-root . \
            --output matbench_asset_report.json
      - name: Oracle regression
        run: |
          python -m tiai_matbench grade \
            --tasks matbench/tasks/dev.jsonl \
            --references matbench/references/dev.jsonl \
            --manifest matbench/MANIFEST.json \
            --submission matbench/examples/oracle_submission.jsonl \
            --output oracle_score_report.json \
            --min-score 1.0
